# ==========================================================
# 金融事件雷达 · 配置
# 加一个渠道 = 在 sources 里加一条，不用改代码
# ==========================================================

runtime:
  poll_seconds: 30          # 每轮抓取间隔（免费版下限 20 秒）
  max_run_minutes: 350      # 单次任务最长运行 5h50m，留给 GitHub 6h 上限
  backfill_minutes: 120     # 启动时回溯补抓的时间窗口
  retry_minutes: 90         # 补推窗口：这段时间内没送达的 L2/L3 会重试
  retry_max: 3              # 单条最多重试几次，避免打不通时无限重试
  timezone: Asia/Shanghai

# ----------------------------------------------------------
# 评分阈值
# ----------------------------------------------------------
thresholds:
  push: 70                  # >= 70 立即推送
  digest: 50                # 50-69 进摘要池
  daily_push_hint: 30       # 单日推送超过这个数，提示调阈值

# ----------------------------------------------------------
# 推送
# ----------------------------------------------------------
notify:
  # 通道链：按顺序尝试，前一个失败才用下一个。改这个列表即改优先级。
  order: ["bark", "wecom", "ntfy"]
  timeout: 3                # 单通道最多等这么多秒，超时立刻换下一个
  bark:
    enabled: true
    url: ""                 # 形如 https://api.day.app/xxxxxxxx（真实地址放 settings.json 或环境变量 BARK_URL）
    sound: ""               # 留空用默认
    level3_sound: "alarm"   # L3 强提醒音
    group: "金融雷达"
  wecom:
    enabled: false
    webhook: ""             # 企业微信群机器人地址（真实值放 settings.json 或环境变量 WECOM_WEBHOOK）
  ntfy:
    enabled: false
    server: "https://ntfy.sh"
    topic: ""               # 频道名（真实值放 settings.json 或环境变量 NTFY_TOPIC）
  quiet_hours:
    enabled: true
    start: "23:30"
    end: "07:00"            # 该区间内 L2 合并为一条，L3 不受限

# ----------------------------------------------------------
# AI 摘要：三层降级，任一层挂了不影响主流程
# ----------------------------------------------------------
ai:
  enabled: true
  primary:
    provider: zhipu
    model: glm-4-flash
    api_key: ""             # 环境变量 ZHIPU_API_KEY 优先
    base_url: "https://open.bigmodel.cn/api/paas/v4"
  fallback:
    provider: siliconflow
    model: Qwen/Qwen2.5-7B-Instruct
    api_key: ""             # 环境变量 SILICONFLOW_API_KEY 优先
    base_url: "https://api.siliconflow.cn/v1"
  max_tokens: 220
  timeout: 20
  translate_en: true        # 英文消息翻成中文，保留原文标题与链接

# 英文消息翻译：AI 优先，无 key 时用免费接口兜底
translate:
  enabled: true
  free_daily_limit: 150     # 免费接口每天最多翻多少条，防止被限流

# ----------------------------------------------------------
# 关键词
# ----------------------------------------------------------

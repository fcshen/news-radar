# ----------------------------------------------------------
# 渠道清单
#   type: rss | sina | jin10 | szse | telegram | quote
#   tier: official | exchange | authority | media | unverified
#   region: cn | intl   （仅用于展示与统计，不影响流程）
# ----------------------------------------------------------
sources:
  # ===== 国内 · 快讯与财经媒体 =====
  - name: 新浪财经7×24
    type: sina
    tier: media
    region: cn
    enabled: true
    interval: 30

  - name: 金十数据
    type: jin10
    tier: media
    region: cn
    enabled: true
    interval: 30

  - name: 华尔街见闻
    type: rss
    tier: media
    region: cn
    enabled: true
    interval: 60
    url: "https://rsshub.app/wallstreetcn/live/global"

  # 财新的 RSS 仍返回 200 但内容为空（付费墙），改用中新网财经
  - name: 中新网财经
    type: rss
    tier: media
    region: cn
    enabled: true
    interval: 180
    url: "https://www.chinanews.com.cn/rss/finance.xml"

  # 第一财经的接口返回网页而非 RSS，解析不出条目，改用人民网财经
  - name: 人民网财经
    type: rss
    tier: authority
    region: cn
    enabled: true
    interval: 180
    url: "http://www.people.com.cn/rss/finance.xml"

  # ===== 国内 · 交易所与监管（一手） =====
  - name: 深交所公告
    type: szse
    tier: exchange
    region: cn
    enabled: true
    interval: 60

  - name: 上交所公告
    type: rss
    tier: exchange
    region: cn
    enabled: false
    interval: 60
    url: ""

  - name: 巨潮资讯
    type: rss
    tier: exchange
    region: cn
    enabled: false
    interval: 60
    url: ""

  # ===== 国内 · 官方发布 =====
  # 中国政府网的 pushinfo RSS 已下线（404），且全站无可用 RSS。
  # 改用人民网时政，覆盖国常会/部委通稿；但注意这是转载而非原文，等级下调为权威媒体。
  - name: 人民网时政
    type: rss
    tier: authority
    region: cn
    enabled: true
    interval: 300
    url: "http://www.people.com.cn/rss/politics.xml"

  - name: 国家统计局
    type: rss
    tier: official
    region: cn
    enabled: true
    interval: 600
    url: "https://www.stats.gov.cn/sj/zxfb/rss.xml"

  # ===== 海外 · 通讯社与主流媒体 =====
  - name: Reuters
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 60
    url: "https://www.reuters.com/arc/outboundfeeds/rss/?outputType=xml"

  - name: WSJ Markets
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 120
    url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"

  - name: WSJ World
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 180
    url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml"

  - name: CNBC Top
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 90
    url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"

  - name: CNBC Economy
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 180
    url: "https://www.cnbc.com/id/20910258/device/rss/rss.html"

  - name: MarketWatch
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 120
    url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"

  - name: Financial Times
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 180
    url: "https://www.ft.com/rss/home"

  - name: NYT Business
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 180
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml"

  - name: Nikkei Asia
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 180
    url: "https://asia.nikkei.com/rss/feed/nar"

  - name: SCMP
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 180
    url: "https://www.scmp.com/rss/91/feed"

  - name: Al Jazeera
    type: rss
    tier: media
    region: intl
    enabled: true
    interval: 180
    url: "https://www.aljazeera.com/xml/rss/all.xml"

  - name: 矿业与金属Mining
    type: rss
    tier: media
    region: intl
    enabled: true
    interval: 600
    url: "https://www.mining.com/feed/"

  # ===== 海外 · 官方与央行 =====
  - name: 美联储
    type: rss
    tier: official
    region: intl
    enabled: true
    interval: 300
    url: "https://www.federalreserve.gov/feeds/press_all.xml"

  - name: 欧洲央行
    type: rss
    tier: official
    region: intl
    enabled: true
    interval: 600
    url: "https://www.ecb.europa.eu/rss/press.html"

  - name: 日本央行
    type: rss
    tier: official
    region: intl
    enabled: true
    interval: 600
    url: "https://www.boj.or.jp/en/rss/whatsnew.xml"

  - name: 美国能源署EIA
    type: rss
    tier: official
    region: intl
    enabled: true
    interval: 600
    url: "https://www.eia.gov/rss/todayinenergy.xml"

  # IMF 官网已对非浏览器请求返回 403，改用 SEC 执法公告（对中概/港股监管风险更直接）
  - name: 美国SEC
    type: rss
    tier: official
    region: intl
    enabled: true
    interval: 600
    url: "https://www.sec.gov/news/pressreleases.rss"

  # BIS 的 RSS 路径已下线（全部 404），改用联邦公报 OFAC 制裁公告原文
  # 制裁是关税之后对 A股/中概/大宗最直接的官方动作
  - name: 美国OFAC制裁
    type: rss
    tier: official
    region: intl
    enabled: true
    interval: 300
    url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=office-of-foreign-assets-control"

  # ===== 海外 · 商品与地缘垂直 =====
  - name: OilPrice
    type: rss
    tier: media
    region: intl
    enabled: true
    interval: 300
    url: "https://oilprice.com/rss/main"

  # ISW 全站被 Cloudflare 拦（403），改用国防一号 + 中东观察
  - name: 国防一号DefenseOne
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 900
    url: "https://www.defenseone.com/rss/all/"

  # 中东地缘：直接对应原油与航运，是 ISW 俄乌视角的补充
  - name: 中东观察AlMonitor
    type: rss
    tier: authority
    region: intl
    enabled: true
    interval: 900
    url: "https://www.al-monitor.com/rss"

  # ===== Telegram 公开频道 =====
  # 频道名填在 channel 里（不带 @），走云端抓取
  - name: Telegram频道
    type: telegram
    tier: media
    region: intl
    enabled: false
    interval: 30
    channel: ""

  # ===== 行情异动触发 =====
  - name: 行情异动
    type: quote
    tier: exchange
    region: cn
    enabled: true
    interval: 30
    codes:
      - sh000001
      - sz399001
      - sz399006
      - sh000300
      - sh000905
      - sh000852
    move_threshold: 1.2      # 单次轮询涨跌幅超过该值触发提醒

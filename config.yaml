    - 降息
    - 加息
    - LPR
    - MLF
    - 逆回购
    - 公开市场操作
    - 存款准备金
    - 央行
    - 证监会
    - 银保监会
    - 金融监管总局
    - 国常会
    - 国务院
    - 政治局
    - 发改委
    - 财政部
    - 关税
    - 制裁
    - 出口管制
    - 实体清单
    - 美联储
    - FOMC
    - 非农
    - CPI
    - PPI
    - PMI
    - 社融
    - 外汇储备
    - 熔断
    - 国债收益率
    - OPEC
    - 减产
    - 地缘
    - 战争
    - 冲突
    - 停火

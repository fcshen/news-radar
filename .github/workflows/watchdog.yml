name: watchdog

# 数据停摆的自动守望，兼备份执行者。
#
# 为什么需要它：2026-11-27 主任务 11:17 正常跑完后，本该 14:05 接上的定时任务
# 迟迟没来，数据静静停在 11:15，四个半小时无人察觉，最后是用户自己发现的。
# 主任务再可靠，也需要一个不依赖它的角色盯着。
#
# 第一版想用 GITHUB_TOKEN 调 workflow_dispatch 把主任务踢起来，实测 API 返回
# 204 却压根没创建运行。所以不再依赖这条路：发现停摆就自己装依赖、自己采集、
# 自己提交。监控者和执行者合一，中间少一个环节就少一处能断的地方。
#
# 这个 workflow 平时很轻（十几秒），只有真停摆时才跑满 8 分钟。

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      stale_min:
        description: "临时阈值（分钟），留空用默认 35。设 0 可验证整条链路"
        required: false
        default: ""
  # 改了守护逻辑本身时立刻跑一次，不用等下一个 20 分钟
  push:
    paths:
      - ".github/workflows/watchdog.yml"
      - "tools/healthcheck.py"
      - "tools/alert.py"

permissions:
  contents: write         # 接管时要提交 data/
  actions: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 判断数据是否停摆
        id: chk
        env:
          STALE_MIN: "0"   # TEST
        run: python tools/healthcheck.py >> "$GITHUB_OUTPUT"

      - name: 判定结果
        run: |
          echo "滞后 ${{ steps.chk.outputs.mins }} 分钟 · 停摆=${{ steps.chk.outputs.stale }} · 需告警=${{ steps.chk.outputs.alert }} · 库内 ${{ steps.chk.outputs.total }} 条"

      - name: 停摆则自己接管采集
        if: steps.chk.outputs.stale == '1'
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          echo "数据已滞后 ${{ steps.chk.outputs.mins }} 分钟，接管采集"
          python -m pip install -q -r requirements.txt

          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"

          # 8 分钟足够把断档期的消息抓回来（backfill 覆盖最近 60 分钟）
          python main.py --minutes 1 || echo "采集异常，仍然尝试提交已有数据"

          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有新数据"
          else
            git commit -m "data: watchdog 接管 $(date -u +%Y-%m-%dT%H:%MZ)" || true
            for i in 1 2 3; do
              git pull --rebase --autostash -q || true
              if git push -q; then echo "已提交"; break; fi
              echo "push 失败（第 $i 次）"
              sleep 5
            done
          fi

      - name: 停摆就把结果推到手机
        if: steps.chk.outputs.stale == '1'
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          MINS: ${{ steps.chk.outputs.mins }}
        run: |
          python tools/alert.py "🛠 雷达刚停过" \
            "检测到数据滞后 ${MINS} 分钟，已自动接管重启并补抓。这条只是告诉你断过，不用处理。"

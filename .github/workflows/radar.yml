name: radar

on:
  schedule:
    # 每 6 小时拉起一次，单次跑 5h50m，中间空档靠启动回溯补齐
    - cron: "5 */6 * * *"
  workflow_dispatch:
  # 代码类改动推送后自动重启，不必再去 Actions 页点按钮。
  # 这里只列代码文件，data/ 的定时提交不会命中，避免自我循环触发。
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "main.py"
      - "app.py"
      - "index.html"
      - "setup.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/radar.yml"

concurrency:
  group: radar
  # 新任务直接顶掉正在跑的旧任务：永远只有一个实例在跑，
  # 改了代码或补了 secret 后无需手动去 Actions 页取消。
  # 数据靠启动回溯 120 分钟 + 每 30 分钟提交补偿，被顶掉不丢事件。
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 配置 git
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"

      - name: 首轮采集
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          # 备用通道，没在仓库里配 Secret 时为空，代码会自动跳过
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python main.py --once

      - name: 提交首轮数据
        run: |
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "data: 首轮 $(date -u +%Y-%m-%dT%H:%MZ)"
            # 必须先同步：代码 push 与定时任务的数据 push 常撞在一起，
            # 不做 rebase 会因 non-fast-forward 被拒，且这一步没有重试机会，
            # 结果是首轮数据一直推不上去、手机端停在旧数据。
            git pull --rebase --autostash -q || true
            git push || echo "推送失败，稍后重试"
          fi

      - name: 长跑采集 + 每 10 分钟提交数据
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          # 备用通道，没在仓库里配 Secret 时为空，代码会自动跳过
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          # 后台：每 10 分钟把 data/ 提交一次，Pages 随之重建。
          # 间隔不能更短：GitHub Pages 软限制约 10 次构建/小时，600 秒 = 6 次/小时最稳。
          # 手机网页看到的事件，延迟 ≈ 这个间隔 + Pages 重建 1 分钟；要"零延迟"靠 Bark 推送。
          (
            while true; do
              sleep 600
              git add data/ 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || true
                git pull --rebase --autostash -q || true
                git push -q || echo "push 失败，下一轮重试"
              fi
            done
          ) &
          python main.py --minutes 350

name: radar

on:
  schedule:
    # 每 15 分钟拉起一次，单次只跑 10 分钟。
    #
    # 为什么不再用「6 小时拉起、一次跑 5h50m」：GitHub 的 schedule 在公开仓库上
    # 实测会迟到 2~3 小时（11-26 的 14:05 实际 16:03 才起，11-27 的 02:05 是
    # 05:24 才起）。长跑一结束、下一次又没来，中间就是几个小时的静默空洞。
    # 2026-11-27 因此空转 4 小时 39 分钟。
    #
    # 现在改成高频短跑：某一次被跳过或迟到，15 分钟后还有下一次，最多空几分钟。
    # 每次启动都会回溯补抓，所以断档期的事件不会丢。
    - cron: "*/20 * * * *"
  # 主力的"叫工"来自工作流自己：每次开局就派发下一次（见下方「续链」步骤）。
  # 这条 cron 只是续链失效时的兜底，所以故意放稀。
  #
  # 别被 Actions 页面里的 "cancelled" 吓到：同一 concurrency 组只保留一个排队位，
  # 兜底 cron 抢到排队位时会把链条里那个待跑的挤掉，被挤掉的就显示 cancelled。
  # 这是设计使然，不是故障。
  #
  # 为什么不再用外部定时器：GitHub 自己的 schedule 不可靠（见上），而外部
  # cron-job.org 需要注册账号 + 邮箱验证 + 一个 PAT，用户做不下来。2026-11-28
  # 实测发现 GITHUB_TOKEN 配 actions: write 其实能派发自身，于是不再需要它们。
  workflow_dispatch:
    inputs:
      minutes:
        description: "本次采集时长（分钟）"
        required: false
        default: "20"
  # 代码类改动推送后自动重启，不必再去 Actions 页点按钮。
  # 这里只列代码文件，data/ 的定时提交不会命中，避免自我循环触发。
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "main.py"
      - "app.py"
      - "index.html"
      - "setup.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/radar.yml"

concurrency:
  group: radar
  # 不能再用 cancel-in-progress:true 了：外部每 5 分钟就调一次，而单次跑 4 分钟，
  # 一旦某次超时到 5 分钟以上，新调度会把正在跑的那次掐死，形成"永远跑不完"。
  # 改成排队：正在跑的跑完，排队的那次接着跑。GitHub 只保留一个排队位，
  # 更早的排队会被自动丢弃，所以不会堆积。
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # 「续链」要派发工作流，缺这个权限会拿到 403/静默失败

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # ── 续链：开局就把下一次叫进队列 ──────────────────────────────
      # 官方文档写「用 GITHUB_TOKEN 创建的事件不会触发新工作流（防递归）」，
      # 但 2026-11-28 实测反例成立：权限给到 actions: write 并显式传 ref 之后，
      # HTTP 204 且真的创建了运行（21:00:16 的 push 运行 → 21:00:21 出现一条
      # workflow_dispatch 运行）。所以不再需要 cron-job.org，也不再需要 PAT。
      #
      # 为什么放在"开局"而不是"收尾"：这次跑到一半挂了，接班人已经在队列里等着，
      # 不会因为没执行到最后一步而断链。
      #
      # 为什么不会无限堆积：concurrency 同一组只保留「一个在跑 + 一个排队」，
      # 更早的排队会被自动取消。所以永远只有一份在跑，链条自己闭环。
      #
      # 要整体停下来：去 Actions 页把 radar 这个 workflow 点 Disable，
      # 已有的运行和队列会一起停掉。
      - name: 续链·把下一次叫进队列
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/d.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/radar.yml/dispatches" \
              -d '{"ref":"main","inputs":{"minutes":"20"}}')
            echo "第 $i 次派发 → HTTP $code"
            if [ "$code" = "204" ]; then break; fi
            sleep 3
          done
          head -c 300 /tmp/d.txt 2>/dev/null || true
          echo "（非 204 也不致命：*/10 的 cron 会补位）"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 配置 git
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"

      - name: 首轮采集
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          # 备用通道，没在仓库里配 Secret 时为空，代码会自动跳过
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python main.py --once

      - name: 提交首轮数据
        # 推送失败不让整个 run 立刻挂掉：主循环还会反复重试。
        # 真正的失败会在末尾统一判定（红的 run + 手机提醒）。
        continue-on-error: true
        run: |
          bash tools/push_data.sh "data: 首轮 $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: 采集主循环 + 每 2 分钟提交数据
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          # 备用通道，没在仓库里配 Secret 时为空，代码会自动跳过
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          # 后台：每 2 分钟把 data/ 提交一次。这是手机端"看到最新"的主要延迟来源，
          # 采集本身 30 秒一轮，但数据不进仓库，前端就永远读不到。
          #
          # 为什么不设成 10 分钟（旧版）：GitHub Pages 对 branch 部署有约 10 次/小时
          # 的软构建限制，超出时它只会"跳过这次构建"、推迟到下一次，并不会丢数据
          # （commit 已经进仓库）。也就是说超限的代价是构建频率自动退化回 10 分钟，
          # 不会比旧版更差；没超限时则快 5 倍。所以 120 秒是纯增益。
          #
          # 提交/推送全部交给 tools/push_data.sh：那里显式 fetch + rebase，
          # 不依赖 upstream，也不会被残留的 rebase 卡死。
          (
            while true; do
              sleep 120
              bash tools/push_data.sh || true
            done
          ) &
          python main.py --minutes ${{ inputs.minutes || '20' }}

      - name: 推送失败则提醒手机并让本 run 变红
        # 必须 always()：主循环被 timeout 杀掉时这一步也要跑。
        #
        # 为什么这一步比日志重要：以前推送失败只在日志里 echo 一句，Actions
        # 页面照样是绿色，谁都不会去看。现在失败会让 run 变红——我查 API 就能
        # 发现，不用等手机先停摆、再由人来问。
        if: always()
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          FLAG="${RUNNER_TEMP:-/tmp}/pushfail.log"
          if [ -s "$FLAG" ]; then
            echo "── 推送失败记录 ──"
            cat "$FLAG"
            python tools/alert.py "⚠️ 雷达数据推不上去" \
              "最近一次提交没进仓库，手机看板会停在旧数据。已在自动重试，若连续两次收到这条请告诉我。" || true
            echo "::error::数据推送持续失败，看板会停在旧数据"
            exit 1
          fi
          echo "数据推送正常"

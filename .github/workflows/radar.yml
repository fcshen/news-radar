name: radar

on:
  schedule:
    # 每 6 小时拉起一次，单次跑 5h50m，中间空档靠回溯补齐
    - cron: "5 */6 * * *"
  workflow_dispatch:

# 同一时间只允许一个任务，避免重叠推送
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集与推送
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python main.py --minutes 350

      - name: 提交数据
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push || echo "推送失败，下次重试"
          fi

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="金融雷达">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<title>金融事件雷达</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d2129; --line:#262b34;
    --text:#e6e8eb; --dim:#9aa3ae; --faint:#6b7480;
    --l3:#e5484d; --l2:#f5a524; --l1:#5b8def; --l0:#4a5160;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       padding-bottom:calc(58px + var(--safe-b))}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.96);
         backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
         padding:calc(10px + var(--safe-t)) 16px 8px}
  .bar{display:flex;align-items:center;gap:10px;max-width:840px;margin:0 auto}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px;white-space:nowrap}
  .meta{font-size:12px;color:var(--faint);margin-left:auto;white-space:nowrap}
  .icon-btn{width:32px;height:32px;flex:0 0 auto;border-radius:9px;border:1px solid var(--line);
            background:var(--panel);color:var(--dim);font-size:15px;line-height:1;
            display:flex;align-items:center;justify-content:center;cursor:pointer}
  .icon-btn:active{background:var(--panel2)}
  .icon-btn.spin{animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .filters{display:flex;gap:6px;overflow-x:auto;max-width:840px;margin:9px auto 0;
           padding-bottom:2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
        color:var(--dim);border-radius:999px;padding:5px 13px;font-size:12.5px;
        cursor:pointer;transition:.15s;white-space:nowrap}
  .chip.on{background:#2a3140;border-color:#3a4457;color:#fff}
  main{max-width:840px;margin:0 auto;padding:6px 12px}
  .item{display:flex;gap:12px;padding:14px 12px;border-radius:12px;
        border:1px solid transparent;cursor:pointer}
  .item:hover{background:var(--panel)}
  .item.open{background:var(--panel)}
  .rail{flex:0 0 auto;width:46px;text-align:right;padding-top:1px}
  .time{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .dot{width:6px;height:6px;border-radius:50%;margin:6px 0 0 auto}
  .body{flex:1;min-width:0}
  .ttl{font-size:15px;font-weight:500;line-height:1.45;margin:0 0 6px;word-break:break-word}
  .sum{font-size:13.5px;color:var(--dim);margin:0 0 8px;word-break:break-word;
       display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .item.open .sum{display:block;-webkit-line-clamp:unset;overflow:visible}
  .imp{font-size:13px;color:#c9a227;margin:0 0 8px;padding-left:9px;border-left:2px solid #4a3d13}
  .imp b{font-weight:500;color:#e0b536}
  .orig{font-size:12px;color:#6b7280;margin:0 0 6px;line-height:1.4;
        display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .item.open .orig{-webkit-line-clamp:unset;overflow:visible}
  .sum.raw{color:#6b7280;font-style:italic}
  .sum.raw::before{content:"原文 ";font-style:normal;color:#4b5563;font-size:11px}
  .foot{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px;color:var(--faint)}
  .badge{padding:1px 7px;border-radius:5px;background:var(--panel2);
         border:1px solid var(--line);color:var(--dim)}
  .badge.t-official{border-color:#2f4a33;color:#7fc08a}
  .badge.t-exchange{border-color:#2f3f4a;color:#7fb4c0}
  .badge.t-authority{border-color:#3d3a2a;color:#c0b47f}
  .src{color:var(--dim)}
  .new{background:var(--l3);color:#fff;border-radius:4px;padding:0 5px;font-size:10.5px}
  a{color:#5b8def;text-decoration:none}
  .empty{text-align:center;color:var(--faint);padding:60px 22px;font-size:14px;line-height:2}
  .empty b{color:var(--dim);font-weight:500}
  .l3{border-left:3px solid var(--l3)}
  .l2{border-left:3px solid var(--l2)}
  .l1{border-left:3px solid var(--l1)}
  .l0{border-left:3px solid transparent}
  footer{position:fixed;bottom:0;left:0;right:0;z-index:20;
         background:rgba(15,17,21,.97);border-top:1px solid var(--line);
         padding:8px 16px calc(8px + var(--safe-b));text-align:center;
         font-size:11.5px;color:var(--faint);
         display:flex;justify-content:center;gap:14px;align-items:center}
  footer a{color:var(--faint)}
  @media(max-width:480px){
    .item{padding:13px 6px;gap:10px}
    .rail{width:40px}
    .ttl{font-size:14.5px}
    main{padding:6px 8px}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>金融事件雷达</h1>
    <span class="meta" id="meta">连接中…</span>
    <button class="icon-btn" id="refresh" aria-label="刷新">⟳</button>
  </div>
  <div class="filters" id="filters">
    <button class="chip on" data-f="rec">推荐</button>
    <button class="chip" data-f="L3">强提醒</button>
    <button class="chip" data-f="L2">即时</button>
    <button class="chip" data-f="L1">摘要</button>
    <button class="chip" data-f="all">全部</button>
    <button class="chip" data-f="cn">国内</button>
    <button class="chip" data-f="intl">海外</button>
  </div>
</header>

<main id="list"><div class="empty">正在读取事件库…</div></main>

<footer>
  <span id="stat">—</span>
  <a href="setup.html">推送设置</a>
</footer>

<script>
const TL={official:"官方",exchange:"交易所",authority:"权威媒体",media:"媒体",unverified:"未证实"};
const LV={L3:"强提醒",L2:"即时",L1:"摘要",L0:"归档"};
const POLL=20000;
let ALL=[], FILTER="rec", LAST_SEEN=Number(localStorage.getItem("lastSeen")||0);

const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tsNum=e=>{const d=new Date((e.ts||"").replace(" ","T")); return isNaN(d)?0:d.getTime();};

function rowsFor(f){
  let r=ALL.slice();
  if(f==="rec") r=r.filter(e=>e.level!=="L0");
  else if(f==="all") r=r;
  else if(f==="cn"||f==="intl") r=r.filter(e=>e.region===f);
  else r=r.filter(e=>e.level===f);
  return r;
}

function render(){
  const list=$("list");
  const rows=rowsFor(FILTER).sort((a,b)=>tsNum(b)-tsNum(a));
  if(!rows.length){
    list.innerHTML=ALL.length
      ? '<div class="empty">这个筛选下暂时没有内容</div>'
      : '<div class="empty"><b>还没有收到消息</b><br>采集刚启动时需要 30 秒左右<br>拉完会显示在这里</div>';
    return;
  }
  list.innerHTML=rows.map(e=>{
    const hm=(e.ts||"").slice(11,16)||"--:--";
    const lv=e.level||"L0";
    const cls="l"+lv.slice(1);
    const fresh=tsNum(e)>LAST_SEEN?'<span class="new">新</span>':"";
    // 中文标题优先；英文源在下方补一行原文小字
    const zh=e.title_zh||"";
    const head=zh||e.title||"";
    const orig=(zh&&e.title)?`<p class="orig">${esc(e.title)}</p>`:"";
    const text=(e.summary||"").trim()||((e.body||"").trim()!==e.title?(e.body||"").trim():"");
    // 英文事件没有中文摘要时，正文照原文展示但要标明，别让人以为是中文摘要
    const isRawEn=!e.summary&&e.lang==="en"&&text;
    const sum=text?`<p class="${isRawEn?'raw':''} sum">${esc(text)}</p>`:"";
    const imp=e.impact?`<p class="imp"><b>影响（推断）</b>　${esc(e.impact)}</p>`:"";
    const wait=(e.alts&&e.alts.length)?`<span class="badge">同组 ${e.alts.length}</span>`:"";
    const more=(e.sources&&e.sources.length>1)?`<span class="badge">${e.sources.length} 源</span>`:"";
    const link=e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener"
       onclick="event.stopPropagation()">原文 ↗</a>`:"";
    return `<article class="item ${cls}" data-id="${esc(e.id)}">
      <div class="rail"><div class="time">${hm}</div>
        <div class="dot" style="background:var(--${lv.toLowerCase()})"></div></div>
      <div class="body">
        <p class="ttl">${fresh}${esc(head)}</p>
        ${orig}${sum}${imp}
        <div class="foot">
          <span class="src">${esc(e.source)}</span>
          <span class="badge t-${esc(e.tier)}">${TL[e.tier]||e.tier||"媒体"}</span>
          ${more}${wait}${link}
        </div>
      </div>
    </article>`;
  }).join("");
}

function paintMeta(){
  const today=new Date().toLocaleDateString("sv");
  const t=ALL.filter(e=>(e.ts||"").slice(0,10)===today).length;
  const hot=ALL.filter(e=>e.level==="L2"||e.level==="L3").length;
  $("meta").textContent=`今日 ${t} · 待看 ${hot}`;
  $("stat").textContent=`库内 ${ALL.length} 条`;
}

async function load(manual){
  const btn=$("refresh");
  if(manual) btn.classList.add("spin");
  try{
    const r=await fetch("data/events.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    ALL=await r.json();
    ALL.sort((a,b)=>tsNum(b)-tsNum(a));
    paintMeta(); render();
  }catch(err){
    if(!ALL.length){
      $("list").innerHTML=`<div class="empty"><b>读不到数据</b><br>
        请确认电脑端的采集窗口还开着<br><small>${esc(err.message)}</small></div>`;
    }
  }finally{
    if(manual) setTimeout(()=>btn.classList.remove("spin"),400);
  }
}

$("filters").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
  b.classList.add("on"); FILTER=b.dataset.f; render();
});

$("list").addEventListener("click",e=>{
  if(e.target.closest("a")) return;
  const it=e.target.closest(".item"); if(!it) return;
  it.classList.toggle("open");
});

$("refresh").addEventListener("click",()=>load(true));

// 切到后台就停轮询，省电；回来立刻刷新
let timer=setInterval(()=>{if(!document.hidden)load();},POLL);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){clearInterval(timer);}
  else{timer=setInterval(()=>{if(!document.hidden)load();},POLL);load();}
});

window.addEventListener("beforeunload",()=>{
  const ts=ALL.length?tsNum(ALL[0]):0;
  if(ts) localStorage.setItem("lastSeen",String(ts));
});

if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
load();
</script>
</body>
</html>
